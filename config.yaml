# Deal-Alerts: Suchen, Preisgrenzen und Filter.
# Platzhalter-Werte, bis Ludwig seine Suchbegriffe und Preise bestätigt.
#
# channel: Kanalname ohne Emoji, wie im Secret WEBHOOKS (z. B. lego, nike-dunks)
# max_price: Höchstpreis in EUR (ohne Versand)
# ref_price: grober üblicher Verkaufspreis in EUR. Daraus wird der Rabatt
#            berechnet.

marketplace: EBAY_DE
item_location_country: DE
max_posts_per_run: 5          # pro Kanal, gegen Spam
free_deals_per_day: 0      # free-deals-Kanal gibt es nicht mehr; >0 schaltet ihn wieder ein
free_deals_delay_hours: 24

exclude_words:                # Titel mit diesen Wörtern werden ignoriert
  - defekt
  - kaputt
  - bastler
  - ersatzteil
  - fake
  - replica
  - nur hülle
  - nur ovp
  - leerhülle
  - suche

# deal-alerts bekommt nach jedem Lauf eine Übersicht aller neuen Deals mit Link zum Kanal und Post.

# Flips: reduzierte Angebote aus Shops (über mydealz), die auf eBay deutlich teurer verkauft werden.
flips:
  enabled: true
  channel: tech-flips       # Flips ohne passende Nische landen hier
  feeds:
    # Feeds, die es nicht gibt, werden übersprungen und im Log gemeldet.
    - https://www.mydealz.de/rss/new                  # alle neuen Deals, nicht nur heiße
    - https://www.mydealz.de/rss/deals                # heiße Deals
    - https://www.mydealz.de/rss/gruppe/lego
    - https://www.mydealz.de/rss/gruppe/sneaker
    - https://www.mydealz.de/rss/gruppe/gaming
    - https://www.mydealz.de/rss/gruppe/videospiele
    - https://www.mydealz.de/rss/gruppe/fashion-accessoires
    - https://www.mydealz.de/rss/gruppe/pokemon
    - https://www.mydealz.de/rss/gruppe/spielzeug
    - https://www.mydealz.de/rss/gruppe/elektronik
    - https://www.mydealz.de/rss/gruppe/nintendo-switch
    - https://www.mydealz.de/rss/gruppe/playstation
    - https://www.mydealz.de/rss/gruppe/xbox
    - https://www.mydealz.de/rss/gruppe/kleidung
    # weitere Schnäppchen-Seiten (öffentliche RSS-Feeds)
    - https://www.dealdoktor.de/feed/
    - https://www.mein-deal.com/feed/
  min_buy_price: 5
  max_buy_price: 150
  min_profit: 10            # EUR Gewinn nach Gebühren und Versand
  min_roi: 0.25             # mindestens 25 % auf den Einkaufspreis
  ebay_fee: 0.13            # gewerbliche Verkäufer ca. 11-13 %, privat 0
  shipping_cost: 5          # was du für den Versand ausgibst
  min_comparables: 5        # so viele vergleichbare eBay-Angebote nötig
  max_resale_factor: 4      # eBay-Preis > 4x Kaufpreis = vermutlich falsches Produkt
  max_posts_per_run: 3
  exclude_words:
    - gutschein
    - abo
    - vertrag
    - tarif
    - gratis
    - kostenlos
    - cashback
    - streaming
    - app
    - spotify
    - netflix

