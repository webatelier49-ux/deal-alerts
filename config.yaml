# Reduzierte Shop-Deals nach den Regeln oben posten (ohne Gewinn-Check), zusätzlich zu den Flips.
# Ein Deal, der schon als Flip kam, wird hier nicht noch einmal gepostet.
hot_deals:
  enabled: true
  max_posts_per_run: 30     # insgesamt pro Lauf
  max_per_channel: 3        # pro Kanal und Lauf
  max_age_hours: 48         # ältere Deals werden nicht mehr gepostet

