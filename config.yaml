# Deal-Alerts: Suchen, Preisgrenzen und Filter.
# Platzhalter-Werte, bis Ludwig seine Suchbegriffe und Preise bestätigt.
#
# channel: Kanalname ohne Emoji, wie im Secret WEBHOOKS (z. B. lego, nike-dunks)
# max_price: Höchstpreis in EUR (ohne Versand)
# ref_price: grober üblicher Verkaufspreis in EUR. Daraus wird der Rabatt
#            berechnet.

marketplace: EBAY_DE
item_location_country: DE
# eBay-Seiten, die abwechselnd durchsucht werden (pro Lauf eine, wegen eBays Limit von 5000 Abfragen am Tag).
# fx rechnet max_price, ref_price und min_saving aus Euro grob in die Landeswährung um.
markets:
  - {id: EBAY_DE, currency: EUR, country: DE, symbol: "€", site: eBay.de, flag: "🇩🇪", fx: 1}
  - {id: EBAY_US, currency: USD, country: US, symbol: "$", site: eBay.com, flag: "🇺🇸", fx: 1.15}
  - {id: EBAY_GB, currency: GBP, country: GB, symbol: "£", site: eBay.co.uk, flag: "🇬🇧", fx: 0.87}
max_posts_per_run: 2          # pro Kanal und Lauf, nur die besten
free_deals_per_day: 0      # free-deals-Kanal gibt es nicht mehr; >0 schaltet ihn wieder ein
free_deals_delay_hours: 24

exclude_words:                # Titel mit diesen Wörtern werden ignoriert
  - defekt
  - kaputt
  - bastler
  - ersatzteil
  - fake
  - replica
  - nur hülle
  - nur ovp
  - leerhülle
  - suche

# Qualitätsfilter für eBay-Angebote: jedes Angebot wird mit aktuellen eBay-Preisen für genau
# dieses Produkt verglichen. Gepostet wird nur, was deutlich günstiger ist.
quality:
  min_discount: 0.30          # mind. 30 % unter dem eBay-Marktpreis (Median)
  max_discount: 0.75          # mehr als 75 % drunter ist meist ein anderes Produkt oder Zubehör
  min_saving: 15              # mind. 15 € Ersparnis
  min_comparables: 8          # mind. 8 Vergleichsangebote, sonst kein verlässlicher Marktpreis
  min_seller_feedback: 97     # Verkäufer mit mind. 97 % positiv
  min_seller_score: 20        # und mind. 20 Bewertungen
  max_lookups_per_run: 20     # Preisvergleiche pro Lauf (eBay-API-Limit 5000 Aufrufe am Tag)
  exclude_words: [broken, for parts, not working, read description, empty box, box only, reproduction, custom, read,
                  leer, nur karton, nur box, nur anleitung, ohne spiel, ohne controller, gesperrt, icloud,
                  reproduktion, repro, nachbau, inspired, ähnlich, style, look, kopie, bootleg, mystery,
                  zubehör, hülle, case, cover, sticker, poster]

# deal-alerts bekommt nach jedem Lauf eine Übersicht aller neuen Deals mit Link zum Kanal und Post.

# Flips: reduzierte Angebote aus Shops (über mydealz), die auf eBay deutlich teurer verkauft werden.
flips:
  enabled: true
  channel: tech-flips       # Flips ohne passende Nische landen hier
  feeds:
    # Feeds, die es nicht gibt, werden übersprungen und im Log gemeldet.
    - https://www.mydealz.de/rss/new                  # alle neuen Deals, nicht nur heiße
    - https://www.mydealz.de/rss/deals                # heiße Deals
    - https://www.mydealz.de/rss/gruppe/lego
    - https://www.mydealz.de/rss/gruppe/sneaker
    - https://www.mydealz.de/rss/gruppe/gaming
    - https://www.mydealz.de/rss/gruppe/videospiele
    - https://www.mydealz.de/rss/gruppe/fashion-accessoires
    - https://www.mydealz.de/rss/gruppe/pokemon
    - https://www.mydealz.de/rss/gruppe/spielzeug
    - https://www.mydealz.de/rss/gruppe/elektronik
    - https://www.mydealz.de/rss/gruppe/nintendo-switch
    - https://www.mydealz.de/rss/gruppe/playstation
    - https://www.mydealz.de/rss/gruppe/xbox
    - https://www.mydealz.de/rss/gruppe/kleidung
    # weitere Schnäppchen-Seiten (öffentliche RSS-Feeds)
    - https://www.dealdoktor.de/feed/
    - https://www.mein-deal.com/feed/
  min_buy_price: 5
  max_buy_price: 150
  min_profit: 15            # EUR Gewinn nach Gebühren und Versand
  min_roi: 0.30             # mindestens 30 % auf den Einkaufspreis
  ebay_fee: 0.13            # gewerbliche Verkäufer ca. 11-13 %, privat 0
  shipping_cost: 5          # was du für den Versand ausgibst
  min_comparables: 8        # so viele vergleichbare eBay-Angebote nötig
  max_resale_factor: 4      # eBay-Preis > 4x Kaufpreis = vermutlich falsches Produkt
  max_posts_per_run: 3
  exclude_words:
    - gutschein
    - abo
    - vertrag
    - tarif
    - gratis
    - kostenlos
    - cashback
    - streaming
    - app
    - spotify
    - netflix

