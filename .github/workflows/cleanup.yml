name: Clean up old posts

# Optionally also posts or updates the pinned guide at the top of every deal channel (headers.py).

# Deletes bot posts made before the stricter quality filter (quality_since in state.json).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only count what would be deleted"
        type: boolean
        default: false
      cutoff:
        description: "Optional ISO time, e.g. 2026-10-22T17:00:00+00:00 (default: start of the quality filter)"
        type: string
        default: ""
      since:
        description: "Optional ISO time: only delete posts newer than this"
        type: string
        default: ""
      guides:
        description: "Post or update the pinned channel guides afterwards"
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - name: Restore state
        run: git fetch -q origin state && git show origin/state:state.json > state.json
      - name: Delete old posts
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          CUTOFF: ${{ inputs.cutoff }}
          SINCE: ${{ inputs.since }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          WEBHOOKS: ${{ secrets.WEBHOOKS }}
        run: python cleanup.py
      - name: Channel guides
        if: ${{ inputs.guides && !inputs.dry_run }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          WEBHOOKS: ${{ secrets.WEBHOOKS }}
        run: python headers.py
